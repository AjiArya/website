{% component diagram(name: string, caption: string = "") %}
{%- set svg = load_data(path="generated/diagrams/" ~ name ~ ".svg", required=true) -%}
<figure class="diagram" data-diagram data-diagram-name="{{ name }}" data-dg-source="@ajiarya">
  <div class="diagram__toolbar" data-dg-toolbar role="toolbar" aria-label="Diagram controls" hidden>
    <div class="diagram__controls" role="group" aria-label="Animation" data-dg-animation-group>
      <div class="diagram__popover" data-dg-animation-control>
        <button class="diagram__button" type="button" data-dg-animation aria-label="Animation: playing" title="Animation options" aria-haspopup="true"><span class="diagram__icon" data-dg-animation-icon aria-hidden="true">❚❚</span><span class="diagram__button-label" data-dg-animation-label>Pause</span></button>
        <div class="diagram__popover-panel diagram__options-panel" data-dg-animation-panel>
          <button class="diagram__option" type="button" data-dg-anim-action="play"><span class="diagram__option-icon" aria-hidden="true">▶</span><span>Start</span></button>
          <button class="diagram__option" type="button" data-dg-anim-action="pause"><span class="diagram__option-icon" aria-hidden="true">❚❚</span><span>Pause</span></button>
          <button class="diagram__option" type="button" data-dg-anim-action="disable"><span class="diagram__option-icon" aria-hidden="true">■</span><span>Disable</span></button>
        </div>
      </div>
      <div class="diagram__popover" data-dg-speed-control>
        <button class="diagram__button diagram__button--value" type="button" data-dg-speed aria-label="Animation speed: 1x" title="Animation speed" aria-haspopup="true">1×</button>
        <div class="diagram__popover-panel" data-dg-speed-panel>
          <input class="diagram__range" type="range" min="0" max="4" step="1" value="2" data-dg-speed-range aria-label="Animation speed">
          <div class="diagram__ticks" aria-hidden="true">
            <span data-dg-speed-tick>0.25×</span>
            <span data-dg-speed-tick>0.5×</span>
            <span data-dg-speed-tick>1×</span>
            <span data-dg-speed-tick>1.5×</span>
            <span data-dg-speed-tick>2×</span>
          </div>
        </div>
      </div>
      <div class="diagram__popover diagram__popover--end" data-dg-direction-control>
        <button class="diagram__button diagram__button--value diagram__button--direction" type="button" data-dg-direction aria-label="Animation direction: alternating" title="Animation direction" aria-haspopup="true">↔</button>
        <div class="diagram__popover-panel diagram__options-panel" data-dg-direction-panel>
          <button class="diagram__option" type="button" data-dg-direction-option="forward"><span class="diagram__option-icon" aria-hidden="true">→</span><span>Forward</span></button>
          <button class="diagram__option" type="button" data-dg-direction-option="reverse"><span class="diagram__option-icon" aria-hidden="true">←</span><span>Reverse</span></button>
          <button class="diagram__option" type="button" data-dg-direction-option="alternate"><span class="diagram__option-icon" aria-hidden="true">↔</span><span>Alternating</span></button>
        </div>
      </div>
    </div>
    <div class="diagram__controls" role="group" aria-label="Zoom">
      <button class="diagram__button" type="button" data-dg-zoom-out aria-label="Zoom out" title="Zoom out">−</button>
      <span class="diagram__zoom-label" data-dg-zoom-label aria-live="polite">100%</span>
      <button class="diagram__button" type="button" data-dg-zoom-in aria-label="Zoom in" title="Zoom in">+</button>
      <button class="diagram__button diagram__button--fit" type="button" data-dg-fit aria-label="Fit diagram to view" title="Fit diagram">Fit</button>
      <button class="diagram__button diagram__button--fit" type="button" data-dg-reset aria-label="Reset diagram and view" title="Reset diagram">Reset</button>
      <button class="diagram__button diagram__button--value" type="button" data-dg-png aria-label="Copy diagram as PNG" title="Copy diagram as PNG">PNG</button>
    </div>
  </div>
  <div class="diagram__canvas" data-dg-canvas tabindex="0" role="group" aria-label="Diagram; left-drag to select, right-drag to pan, scroll to zoom, drag a node to move it, pinch to zoom">{{ svg | safe }}<div class="diagram__marquee" data-dg-marquee hidden></div></div>
  <p class="diagram__hint" data-dg-hint hidden>Right-drag to pan · Scroll to zoom · Drag a node to move</p>
  {% if caption %}<figcaption>{{ caption }}</figcaption>{% endif %}
  <p class="diagram__source">Source: <a href="https://github.com/AjiArya/website/blob/main/diagrams/{{ name }}.yaml" target="_blank" rel="noopener">diagrams/{{ name }}.yaml</a></p>
</figure>
{%- endcomponent diagram %}
