{% extends "base.html" %}

{% block content %}
<div class="container stack stack--index">
  <header class="page-head">
    <nav class="breadcrumb" aria-label="Breadcrumb"><a href="{{ config.base_url }}/">~</a> / <span aria-current="page">tags</span></nav>
    <h1>Topics<span class="caret" aria-hidden="true">▋</span></h1>
    <p class="page-head__lede">Everything I have written about, grouped by subject.</p>
  </header>

  <div>
    <ul class="tag-cloud">
      {% for term in terms %}
        <li>
          <a href="{{ term.permalink }}">#{{ term.name }}</a>
          <span>{{ term.pages | length }}</span>
        </li>
      {% endfor %}
    </ul>
    <a class="text-link" href="{{ get_url(path='@/blog/_index.md') }}">Browse all writing →</a>
  </div>
</div>
{% endblock content %}
