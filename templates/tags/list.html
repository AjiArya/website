{% extends "base.html" %}

{% block content %}
<header class="page-head container">
  <p class="eyebrow">Tags</p>
  <h1>Topics</h1>
  <p class="page-head__lede">Everything I have written about, grouped by subject.</p>
</header>

<div class="container">
  <ul class="tag-cloud">
    {% for term in terms %}
      <li>
        <a href="{{ term.permalink }}">{{ term.name }}</a>
        <span>{{ term.pages | length }}</span>
      </li>
    {% endfor %}
  </ul>
  <p class="tag-cloud__back">
    <a class="text-link" href="{{ get_url(path='@/blog/_index.md') }}">Browse all writing <span aria-hidden="true">→</span></a>
  </p>
</div>
{% endblock content %}
