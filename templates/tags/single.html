{% extends "base.html" %}

{% block content %}
<header class="page-head container">
  <p class="eyebrow">Tag</p>
  <h1>{{ term.name }}</h1>
  <p class="page-head__lede">{{ term.pages | length }} post{% if term.pages | length != 1 %}s{% endif %} tagged “{{ term.name }}”.</p>
</header>

<div class="container">
  <div class="post-list post-list--archive">
    {% for post in term.pages %}
      {% include "partials/post-card.html" %}
    {% endfor %}
  </div>
</div>
{% endblock content %}
