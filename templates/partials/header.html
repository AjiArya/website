{% set nav_path = current_path | default(value="") %}
<header class="site-header">
  <div class="container site-header__inner">
    <a class="brand" href="{{ config.base_url }}/" aria-label="{{ config.extra.author }} — home">
      <span class="mark" aria-hidden="true">AA</span>
      <span class="brand__text">
        <strong>{{ config.extra.author }}</strong>
        <span>{{ config.extra.role }}</span>
      </span>
    </a>

    <div class="site-header__actions">
      <nav class="site-nav" aria-label="Primary">
        <a href="{{ get_url(path='@/blog/_index.md') }}"{% if "/blog/" in nav_path %} aria-current="page"{% endif %}>writing</a>
        <a href="{{ get_url(path='@/about.md') }}"{% if "/about/" in nav_path %} aria-current="page"{% endif %}>about</a>
      </nav>
      <button class="terminal-trigger" type="button" data-terminal-open aria-label="Open terminal navigation" aria-keyshortcuts="/" title="Navigate (/)">/</button>
    </div>
  </div>
</header>
