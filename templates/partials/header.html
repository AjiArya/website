<header class="site-header">
  <div class="container site-header__inner">
    <a class="brand" href="{{ config.base_url }}/" aria-label="{{ config.extra.author }} — home">
      <span class="brand__mark" aria-hidden="true">AA</span>
      <span class="brand__text">
        <strong>{{ config.extra.author }}</strong>
        <span>{{ config.extra.role }}</span>
      </span>
    </a>

    <nav class="site-nav" id="site-nav" data-site-nav aria-label="Primary">
      <a href="{{ get_url(path='@/blog/_index.md') }}">Writing</a>
      <a href="{{ get_url(path='@/about.md') }}">About</a>
      <a href="{{ config.extra.social.github }}" target="_blank" rel="me noopener">GitHub</a>
      <a href="{{ config.base_url }}/atom.xml">RSS</a>
    </nav>
    <button class="menu-toggle" type="button" data-menu-toggle aria-expanded="false" aria-controls="site-nav" aria-label="Open menu">
      <span class="menu-toggle__bar"></span>
      <span class="menu-toggle__bar"></span>
      <span class="menu-toggle__bar"></span>
    </button>
  </div>
</header>
