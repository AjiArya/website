{% extends "base.html" %}

{% block content %}
<header class="page-head container">
  <p class="eyebrow">Writing</p>
  <h1>{{ section.title }}</h1>
  {% if section.description %}
    <p class="page-head__lede">{{ section.description }}</p>
  {% endif %}
</header>

<div class="container">
  <div class="post-list post-list--archive">
    {% for post in section.pages %}
      {% include "partials/post-card.html" %}
    {% endfor %}
  </div>
</div>
{% endblock content %}
