[package]
name = "site-tools"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Build tooling and YAML-to-SVG diagram compiler for a Zola personal site"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"
